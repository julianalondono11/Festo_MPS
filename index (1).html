<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Estacions Festo MPS · Escola del Treball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blau: #112B3C;
    --blau-mig: #205375;
    --blau-clar: #379CD4;
    --taronja: #F66B0E;
    --taronja-clar: #F4A876;
    --fons: #13293E;
    --targeta: #ffffff;
    --text: #112B3C;
    --text-suau: #325569;
    --vora: #c9c9c9;
    --radi: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; background: var(--fons); }
  body {
    margin: 0;
    font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 12pt;
    line-height: 1.45;
    color: var(--text);
    background: var(--fons);
  }
  .app { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  main.inici { flex: 1; display: flex; padding: 16px; }
  main.inici .llista { flex: 1; width: 100%; grid-auto-rows: 1fr; }
  main.inici .btn.gran { min-height: 96px; justify-content: center; text-align: center; }

  header.cap {
    background: #fff;
    color: var(--blau);
    padding: 24px 20px 22px;
    border-bottom: 5px solid var(--taronja);
    display: flex; align-items: center; justify-content: flex-start; gap: 16px;
  }
  header.cap .cap-text { min-width: 0; }
  header.cap .logo {
    flex: none; height: 104px; width: auto; display: block;
  }
  header.cap .centre { font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--blau-mig); font-weight: 600; }
  header.cap h1 { margin: 6px 0 0; font-size: 26px; line-height: 1.2; }
  header.cap p { margin: 8px 0 0; font-size: 16px; color: var(--text-suau); }

  .barra {
    display: flex; align-items: center; gap: 12px;
    background: #fff; color: var(--blau); padding: 8px 14px;
    border-bottom: 3px solid var(--taronja);
    position: sticky; top: 0; z-index: 5;
  }
  .barra a.enrere {
    color: #fff; text-decoration: none; font-weight: 600; font-size: 15px; flex: none;
    padding: 10px 16px; border-radius: 999px; background: var(--blau);
    min-height: 44px; display: inline-flex; align-items: center;
  }
  .barra .logo-barra { flex: none; height: 56px; width: auto; display: block; }
  .barra .titol-barra { flex: 1; min-width: 0; font-weight: 700; font-size: 17px; line-height: 1.2; }

  main { padding: 18px 16px 32px; }

  .llista { display: grid; gap: 14px; }
  .btn {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; min-height: 72px; padding: 16px 18px;
    background: var(--targeta); color: var(--text);
    border: 2px solid var(--blau-mig); border-radius: var(--radi);
    text-decoration: none; font-size: 20px; font-weight: 650;
    box-shadow: 0 2px 0 rgba(17,43,60,.12);
  }
  .btn:active { background: #fde6d4; border-color: var(--taronja); }
  .btn small { display: block; font-weight: 400; font-size: 14px; color: var(--text-suau); margin-top: 2px; }
  .btn .fletxa { font-size: 22px; color: var(--taronja); flex: none; }
  .btn.cen { justify-content: center; text-align: center; }
  .centrat { text-align: center; }
  .extres { justify-content: center; }
  .btn.gran { min-height: 96px; font-size: 22px; border-color: var(--blau); }
  .btn.desactivat { opacity: .6; pointer-events: none; background: #e0e0e0; border-color: var(--vora); }

  .foto {
    width: 100%; aspect-ratio: 4 / 3; object-fit: contain; display: block;
    background: #fff; border: 1px solid var(--vora); border-radius: var(--radi);
    margin-bottom: 16px;
  }
  .foto-buida {
    width: 100%; aspect-ratio: 4 / 3; display: grid; place-items: center;
    background: #dcdcdc; color: var(--text-suau); border-radius: var(--radi); margin-bottom: 16px;
    text-align: center; padding: 20px;
  }
  .descripcio { margin: 0 0 16px; color: rgba(255,255,255,.82); font-size: 16px; }
  .extres { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .extres a {
    color: var(--blau-mig); font-size: 15px; font-weight: 600; text-decoration: none;
    padding: 10px 14px; border: 1px solid var(--vora); border-radius: 999px; background: #fff;
    min-height: 44px; display: inline-flex; align-items: center;
  }

  h2 { font-size: 22px; margin: 0 0 6px; color: #fff; }
  .cerca {
    width: 100%; font-family: inherit; font-size: 16px; padding: 12px 14px; margin: 10px 0 12px;
    border: 2px solid var(--vora); border-radius: 12px; background: #fff; color: var(--text);
  }
  .cerca:focus { outline: none; border-color: var(--taronja); }
  .filtres { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .filtres button {
    font: inherit; font-size: 15px; padding: 9px 14px; min-height: 44px;
    border: 2px solid var(--vora); background: #fff; color: var(--text); border-radius: 999px;
  }
  .filtres button.actiu { background: var(--taronja); border-color: var(--taronja); color: var(--blau); font-weight: 700; }

  .taula-caixa { background: #fff; border: 1px solid var(--vora); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13.5px; }
  th, td { padding: 9px 5px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--vora); word-wrap: break-word; overflow-wrap: anywhere; }
  th { background: var(--blau-mig); color: #fff; font-size: 12px; font-weight: 700; }
  tr:last-child td { border-bottom: 0; }
  th:nth-child(1), td:nth-child(1) { width: 17%; font-weight: 650; font-variant-numeric: tabular-nums; padding-left: 8px; }
  th:nth-child(2), td:nth-child(2) { width: 16%; white-space: nowrap; }
  th:nth-child(3), td:nth-child(3) { width: 35%; }
  th:nth-child(4), td:nth-child(4) { width: 32%; padding-right: 8px; }
  .sl { display: block; font-weight: 400; font-size: 11px; color: var(--text-suau); margin-top: 2px; line-height: 1.25; }
  .tipus-a { background: #e0e0e0; color: #444444; }
  .tipus-e, .tipus-s, .tipus-a { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; line-height: 1.3; }
  .tipus-e { background: #d3e5f1; color: #205375; }
  .tipus-s { background: #fde0cc; color: #8a3a00; }

  .avis {
    background: #fff1e6; border: 1px solid var(--taronja-clar); border-radius: 12px; padding: 14px 16px;
    font-size: 16px; margin-bottom: 14px;
  }
  .avis a { color: var(--blau-mig); font-weight: 650; }
  .buit { padding: 18px; text-align: center; color: var(--text-suau); }
  footer { text-align: center; color: var(--text-suau); font-size: 13px; padding: 24px 16px 0; }
</style>
</head>

/* ==========================================================
   CODI DE L'APP
   ========================================================== */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function vistaPrincipal() {
  document.title = LAB.nom + " · " + LAB.centre;
  const botons = Object.entries(STATIONS)
    .sort((a, b) => a[1].ordre - b[1].ordre)
    .map(([id, s]) => `
      <a class="btn gran cen" href="#/${id}">
        <span>${esc(s.nom)} Station<small>${esc(s.titol)}</small></span>
      </a>`).join("");
  app.innerHTML = `
    <header class="cap">
      <img class="logo" src="${LOGO}" alt="Escola del Treball" width="269" height="360">
      <div class="cap-text">
        <div class="centre">${esc(LAB.centre)}</div>
        <h1>${esc(LAB.nom)}</h1>
        <p>${esc(LAB.subtitol)}</p>
      </div>
    </header>
    <main class="inici">
      <div class="llista">${botons}</div>
    </main>`;
}

function vistaEstacio(id) {
  const s = STATIONS[id];
  document.title = s.nom + " · " + LAB.centre;
  const grafcetUrl = s.grafcetDrive || s.grafcet;
  const grafcet = grafcetUrl
    ? `<a class="btn cen" href="${esc(grafcetUrl)}" target="_blank" rel="noopener">Grafcet</a>`
    : `<div class="btn cen desactivat"><span>Grafcet<small>Properament</small></span></div>`;
  app.innerHTML = `
    <div class="barra"><a class="enrere" href="#/">‹ Inici</a><span class="titol-barra">${esc(s.nom)}</span><img class="logo-barra" src="${LOGO}" alt="Escola del Treball" width="269" height="360"></div>
    <main>
      <h2 class="centrat">${esc(s.titol)}</h2>
      <p class="descripcio centrat">${esc(s.descripcio)}</p>
      <img class="foto" id="foto" src="${esc(s.imatge)}" alt="Foto de l'${esc(s.titol.toLowerCase())}">
      <div class="llista">
        <a class="btn cen" href="${esc(s.esquemes)}" target="_blank" rel="noopener">Esquemes</a>
        <a class="btn cen" href="#/${id}/es">Control del PLC</a>
        ${grafcet}
        <a class="btn cen" href="${esc(s.components)}" target="_blank" rel="noopener">Components</a>
      </div>
      <div class="extres">
        <a href="${esc(s.manual)}" target="_blank" rel="noopener">Manual</a>
        <a href="${esc(s.simulacio3d)}" target="_blank" rel="noopener">Simulació 3D</a>
      </div>
    </main>`;
  document.getElementById("foto").addEventListener("error", function () {
    const d = document.createElement("div");
    d.className = "foto-buida";
    d.textContent = "No s'ha pogut carregar la imatge";
    this.replaceWith(d);
  });
}

function vistaES(id) {
  const s = STATIONS[id];
  document.title = "E/S PLC · " + s.nom + " · " + LAB.centre;
  let cos;
  if (!s.es.length) {
    cos = `
      <div class="avis">La taula d'entrades i sortides d'aquesta estació encara no s'ha carregat a l'app.
        Mentrestant, la pots consultar <a href="${esc(s.fullES)}" target="_blank" rel="noopener">al full de càlcul</a>.</div>`;
  } else {
    cos = `
      <input class="cerca" id="cerca" type="search" placeholder="Cerca adreça, símbol…" autocomplete="off">
      <div class="filtres" id="filtres">
        <button data-f="" class="actiu">Totes</button>
        <button data-f="Entrada">Entrades</button>
        <button data-f="Sortida">Sortides</button>
      </div>
      <div class="taula-caixa">
        <table>
          <thead><tr><th>Adreça</th><th>Símbol</th><th>Descripció</th><th>Tipus</th></tr></thead>
          <tbody id="cos-taula"></tbody>
        </table>
        <div class="buit" id="buit" hidden>Cap resultat.</div>
      </div>`;
  }
  app.innerHTML = `
    <div class="barra"><a class="enrere" href="#/${id}">‹ Enrere</a><span class="titol-barra">Control del PLC</span><img class="logo-barra" src="${LOGO}" alt="Escola del Treball" width="269" height="360"></div>
    <main><h2>${esc(s.titol)}</h2>${cos}</main>`;
  if (s.es.length) iniciarTaula(s);
}

function iniciarTaula(s) {
  let filtre = "", text = "";
  const cos = document.getElementById("cos-taula");
  const buit = document.getElementById("buit");
  function pinta() {
    const t = text.trim().toLowerCase();
    const files = s.es.filter(r =>
      (!filtre || r[3].startsWith(filtre)) &&
      (!t || [r[0], r[1], r[2], r[4]].some(c => String(c).toLowerCase().includes(t))));
    cos.innerHTML = files.map(r => `
      <tr><td>${esc(r[0])}<span class="sl">${esc(r[4])}</span></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td>
      <td><span class="${r[3].startsWith("Entrada") ? "tipus-e" : r[3].startsWith("Sortida") ? "tipus-s" : "tipus-a"}">${esc(r[3])}</span></td></tr>`).join("");
    buit.hidden = files.length > 0;
  }
  document.getElementById("cerca").addEventListener("input", e => { text = e.target.value; pinta(); });
  document.getElementById("filtres").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    filtre = b.dataset.f;
    document.querySelectorAll("#filtres button").forEach(x => x.classList.toggle("actiu", x === b));
    pinta();
  });
  pinta();
}

function ruta() {
  const parts = (location.hash || "#/").replace(/^#\/?/, "").split("/").filter(Boolean);
  const id = parts[0];
  window.scrollTo(0, 0);
  if (id && STATIONS[id]) {
    if (parts[1] === "es") return vistaES(id);
    return vistaEstacio(id);
  }
  vistaPrincipal();
}
window.addEventListener("hashchange", ruta);
ruta();
</script>
